server:
  port: ${SERVER_PORT:27403}
  compression:
    enabled: true
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/svg+xml
    min-response-size: 1024

spring:
  application:
    name: ai-apm-web
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    # 应用包级别（可用 APM_LOG_LEVEL 覆盖，生产建议 INFO 减少磁盘/控制台噪声）
    com.databuff.apm: ${APM_LOG_LEVEL:INFO}
  file:
    # 日志文件（目录+文件名；可用 APM_LOG_FILE 覆盖）
    name: ${APM_LOG_FILE:/data/logs/apm-web.log}
  logback:
    rollingpolicy:
      # 滚动文件名：按天 + 序号（%i 供大小滚动使用）。若覆盖 APM_LOG_FILE，建议同步覆盖 APM_LOG_PATTERN
      file-name-pattern: ${APM_LOG_PATTERN:apm-web.%d{yyyy-MM-dd}.%i.log}
      max-history: 7
      total-size-cap: 10GB
      clean-history-on-start: true

apm:
  cluster:
    enabled: false
    node-id: web-1
    zookeeper:
      connect-string: ${APM_CLUSTER_ZOOKEEPER_CONNECT_STRING:${ZK_CONNECT_STRING:}}
  # node.worker-id: 1  # optional snowflake worker id (0-1023); defaults to hostname hash
  doris:
    # Comma-separated FE hosts supported (JDBC loadbalance when more than one)
    fe-host: ${DORIS_FE_HOST:172.25.200.167}
    fe-query-port: ${DORIS_FE_QUERY_PORT:9030}
    fe-http-port: ${DORIS_FE_HTTP_PORT:8030}
    be-http-host: ${DORIS_BE_HTTP_HOST:172.25.200.167}
    be-http-port: ${DORIS_BE_HTTP_PORT:8040}
    config-database: databuff
    metric-database: databuff
    trace-database: databuff
    username: ${DORIS_USER:root}
    password: ${DORIS_PASSWORD:X7$mPq#2Lr&wZ9yE}
    availability:
      probe-interval-ms: ${DORIS_AVAILABILITY_PROBE_INTERVAL_MS:60000}
      connect-timeout-ms: ${DORIS_AVAILABILITY_CONNECT_TIMEOUT_MS:3000}
      socket-timeout-ms: ${DORIS_AVAILABILITY_SOCKET_TIMEOUT_MS:3000}
  platform-metrics:
    # Master switch for web self-metrics (noop instruments + no samplers when false)
    enabled: ${APM_PLATFORM_METRICS_ENABLED:true}
    # SHOW BACKENDS/FRONTENDS → HTTP GET each node's Host:HttpPort/metrics (web leader only)
    doris-enabled: ${APM_PLATFORM_METRICS_DORIS_ENABLED:true}
    # Second 50: before PlatformMetrics flush (~:02) so gauges stamp the closed minute
    doris-sample-cron: ${APM_PLATFORM_METRICS_DORIS_SAMPLE_CRON:50 * * * * *}
  security:
    seed-username: admin
    seed-password: Databuff@123
    jwt:
      secret: dev-secret
      expiration-seconds: 3600
  passport:
    # 员工通行证登录（非 admin 账号走此认证，登录入口/参数名不变）。
    # 提交表单：service / accountName / accountPassword；errorCode 为空即认证成功。
    login-url: ${APM_PASSPORT_LOGIN_URL:http://passport2.uletm.com/api/public/account/login-account-1}
    service: ${APM_PASSPORT_SERVICE:databuff}
    connect-timeout-ms: ${APM_PASSPORT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APM_PASSPORT_READ_TIMEOUT_MS:10000}
  alarm:
    lookback-minutes: 5
    evaluation-cron: "0 * * * * ?"
    webhook:
      url: ${APM_ALARM_WEBHOOK_URL:}
      headers: {}
      queue-capacity: ${APM_ALARM_WEBHOOK_QUEUE_CAPACITY:1000}
      batch-size: ${APM_ALARM_WEBHOOK_BATCH_SIZE:50}
      retry-times: ${APM_ALARM_WEBHOOK_RETRY_TIMES:2}
      retry-backoff-millis: ${APM_ALARM_WEBHOOK_RETRY_BACKOFF_MILLIS:1000}
  monitor:
    pool:
      core-size: 4
      max-size: 16
      queue-size: 100
  ai:
    lookback-minutes: 15
    provider:
      mask-api-key: true
  agent:
    agentscope-enabled: ${APM_AGENT_AGENTSCOPE_ENABLED:true}
    builtin-skills-dir: ${APM_BUILTIN_SKILLS_DIR:../deploy/common/skills}
    custom-skills-dir: ${APM_CUSTOM_SKILLS_DIR:./data/skills}
    workspace-dir: ${APM_DATA_DIR:./data}/ai-workspaces
    workspace-shell-commands: cat,head,tail,grep,wc,ls,file,python3
    workspace-shell-timeout-seconds: 60
    # 在内置危险命令 denylist 之外追加拦截。逗号分隔，两种写法：
    #   1) 直接写命令名 → 整词拦截该命令（任何形态），如 nc、tcpdump
    #   2) 以 re: 开头 → 按正则匹配，用于只禁某种形态不禁整条命令，如 re:\bchmod\s+777\b
    # 示例: nc,tcpdump,re:\bchmod\s+777\b,re:\bkill\s+-9\s+-1\b
    shell-command-denylist: ${APM_AGENT_SHELL_DENYLIST:}
    max-iters: ${APM_AGENT_MAX_ITERS:1000}
    llm-http-timeout-seconds: ${APM_AGENT_LLM_HTTP_TIMEOUT_SECONDS:300}
    # 默认 false：走 AgentScope SDK 默认 HTTP/2。本地 http:// 模型连通性测不过（400 Invalid HTTP request
    # received / curl 却通）时，设为 true 强制 HTTP/1.1，避免 JDK 明文 h2c Upgrade。
    llm-force-http11: ${APM_AGENT_LLM_FORCE_HTTP11:false}
    expert-round-timeout-seconds: ${APM_AGENT_EXPERT_ROUND_TIMEOUT_SECONDS:1200}
    brain-agent-name: brain
    data-agent-name: data
    inspection-agent-name: inspection
